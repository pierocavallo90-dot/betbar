<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BETBAR-ORACLE | V19 STUDIO EDITION</title>
    
    <style>
        :root {
            --bg-color: #02040a;
            --panel-bg: rgba(10, 15, 25, 0.95);
            --border-glow: rgba(0, 240, 255, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --cyan-accent: #00f0ff;
            --violet-accent: #b026ff;
            --gold-accent: #fbbf24;
            --green-value: #10b981;
            --red-value: #ef4444;
            --neon-orange: #ff7700; /* Nuova tinta per lo studio BetBar */
        }

        * { box-sizing: border-box; }
        
        html, body { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #0a1128 0%, #02040a 100%);
            color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--cyan-accent); }

        .top-nav {
            display: flex; justify-content: space-between; align-items: center; 
            height: 60px; background: #000; border-bottom: 2px solid var(--neon-orange);
            padding: 0 20px; box-shadow: 0 0 20px rgba(255, 119, 0, 0.2);
            z-index: 100; position: relative;
        }
        .logo-area { font-size: 1.8rem; font-weight: 900; color: #ff6600; text-shadow: 0 0 10px rgba(255, 102, 0, 0.4); letter-spacing: 1px; text-transform: uppercase;}
        .logo-area span { color: #fff; }
        
        .match-tabs { display: flex; gap: 5px; flex-grow: 1; justify-content: center; overflow-x: auto; }
        .m-tab { background: transparent; color: var(--text-muted); border: none; font-weight: 900; font-size: 1rem; padding: 0 15px; cursor: pointer; transition: 0.3s; border-bottom: 3px solid transparent; outline: none; }
        .m-tab:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .m-tab.active { color: var(--neon-orange); border-bottom-color: var(--neon-orange); background: rgba(255, 119, 0, 0.1); }
        
        .top-tools { display: flex; gap: 10px; align-items: center; }
        .gc-select { background: #0a0f1e; border: 1px solid var(--neon-orange); color: #fff; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; outline: none; cursor: pointer;}
        .api-status { background: rgba(0,0,0,0.8); border: 1px solid var(--cyan-accent); padding: 6px 12px; border-radius: 6px; color: var(--cyan-accent); font-weight: 900; font-size: 0.8rem; box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }

        .main-workspace {
            display: flex; height: calc(100vh - 60px); width: 100vw; gap: 15px;
            padding: 15px; padding-left: 4vw; 
        }

        .col-left { flex: 0 0 25%; max-width: 25%; height: 100%; overflow-y: auto; background: var(--panel-bg); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); padding: 20px; }
        .col-center { flex: 0 0 50%; max-width: 50%; height: 100%; overflow-y: auto; background: var(--panel-bg); border-radius: 12px; border: 1px solid rgba(255,119,0,0.2); padding: 30px; box-shadow: 0 0 30px rgba(255,119,0,0.05); position: relative;}
        .col-right { flex: 0 0 25%; max-width: 25%; height: 100%; overflow-y: auto; background: var(--panel-bg); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); padding: 20px; display: flex; flex-direction: column;}

        .panel-view { display: none; height: 100%; }
        .panel-view.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { font-size: 0.85rem; color: var(--gold-accent); margin: 1.5rem 0 1rem 0; text-transform: uppercase; font-weight: 900; border-bottom: 1px solid rgba(251,191,36,0.3); padding-bottom: 5px; letter-spacing: 1px;}
        .section-title:first-child { margin-top: 0; }
        
        .input-box { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .input-box:focus-within { border-color: var(--cyan-accent); background: rgba(0,0,0,0.8);}
        .input-box label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; font-weight: 900;}
        .input-box input, .input-box select { width: 100%; background: transparent; border: none; color: #fff; font-size: 1.4rem; font-weight: 900; text-align: center; outline: none; }
        .input-box input { border-bottom: 2px solid var(--text-muted); padding-bottom: 5px; }
        .input-box input:focus { border-color: var(--cyan-accent); }

        .api-btn { width: 100%; background: linear-gradient(90deg, var(--cyan-accent), #00a2ff); color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-size: 1rem; margin-top: 10px; box-shadow: 0 0 15px rgba(0,240,255,0.3);}
        .api-btn:hover { filter: brightness(1.2); box-shadow: 0 0 25px rgba(0,240,255,0.6); }

        /* EDITOR COMPARAZIONE (CENTRO) */
        .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;}
        .editor-title { font-size: 1.4rem; font-weight: 900; color: #fff; display:flex; align-items:center; gap: 10px;}
        .editor-title span { color: var(--cyan-accent); }
        .btn-broadcast { background: linear-gradient(90deg, #000, #0a1128); border: 2px solid var(--neon-orange); color: var(--neon-orange); padding: 12px 25px; border-radius: 8px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-size: 1.1rem; box-shadow: 0 0 15px rgba(255,119,0,0.2); letter-spacing: 1px;}
        .btn-broadcast:hover { background: var(--neon-orange); color: #000; box-shadow: 0 0 25px rgba(255,119,0,0.6); transform: scale(1.02); }

        .comp-grid-wrap { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 20px;}
        .comp-row-header { display: grid; grid-template-columns: 140px repeat(6, 1fr); gap: 10px; margin-bottom: 15px;}
        .comp-lbl { color: var(--text-muted); font-weight: 900; font-size: 0.85rem; text-align: center; text-transform: uppercase;}
        .comp-row { display: grid; grid-template-columns: 140px repeat(6, 1fr); gap: 10px; margin-bottom: 15px; align-items: center;}
        .comp-row input { background: #000; border: 1px solid rgba(255,255,255,0.2); color: #fff; font-weight: 900; font-size: 1.2rem; text-align: center; padding: 12px 5px; border-radius: 6px; outline: none; transition: 0.2s;}
        .comp-row input:focus { border-color: var(--neon-orange); box-shadow: 0 0 10px rgba(255,119,0,0.3); background: rgba(255,119,0,0.05);}
        .comp-row .bookie-name { font-size: 1.1rem; background: rgba(255,255,255,0.05); border-color: var(--gold-accent); color: var(--gold-accent);}

        /* TELEGRAM DESK (DESTRA) */
        .tg-header { font-size: 1.1rem; font-weight: 900; color: var(--violet-accent); text-transform: uppercase; margin-bottom: 15px; text-align: center; border-bottom: 1px solid rgba(176,38,255,0.3); padding-bottom: 10px;}
        .tg-textarea { width: 100%; flex-grow: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.95rem; outline: none; resize: none; margin-bottom: 15px;}
        .tg-textarea:focus { border-color: var(--violet-accent); }
        .btn-tg { width: 100%; background: var(--violet-accent); color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 1rem; transition: 0.2s;}
        .btn-tg:hover { filter: brightness(1.2); box-shadow: 0 0 20px rgba(176, 38, 255, 0.4); }

        /* SCHERMATA FULL-SCREEN BROADCAST (STUDIO EDITION) */
        .broadcast-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #050505; 
            /* QUI CARICA LA TUA IMMAGINE STUDIO */
            background-image: url('sfondo.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 9999; display: none;
            flex-direction: column; align-items: center; justify-content: flex-start;
            font-family: 'Segoe UI', Arial, sans-serif; cursor: pointer;
        }
        
        .bc-card {
            width: 80vw; max-width: 1200px; 
            /* Effetto Vetro per far vedere lo sfondo */
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(10px);
            border: 2px solid var(--neon-orange); 
            border-radius: 24px;
            box-shadow: 0 0 50px rgba(255, 119, 0, 0.25), inset 0 0 20px rgba(255, 119, 0, 0.1);
            padding: 40px 50px; text-align: center; position: relative;
            /* Spinge la tabella verso il basso per non coprire il logo gigante nello sfondo */
            margin-top: 30vh; 
        }

        /* Nomi squadre grandi stile tabellone stadio */
        .bc-match { font-size: 3.5rem; color: #fff; font-weight: 900; text-transform: uppercase; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; gap: 30px; letter-spacing: 2px; text-shadow: 0 0 20px rgba(0,0,0,0.8);}
        .bc-vs { color: var(--neon-orange); font-size: 2.5rem; text-shadow: 0 0 20px var(--neon-orange);}
        
        .bc-table-wrap { border: 2px solid var(--neon-orange); border-radius: 16px; overflow: hidden; }
        .bc-table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,0.6);}
        .bc-table th, .bc-table td { border: 1px solid rgba(255,119,0,0.5); padding: 20px 15px; text-align: center; font-size: 2.4rem; font-weight: 900; color: #fff; }
        .bc-table th { color: #fff; text-transform: uppercase; font-size: 1.4rem; padding: 15px; background: rgba(255,119,0,0.15);}
        .bc-table td:first-child { color: #fff; font-size: 2rem; text-transform: capitalize; background: rgba(255,255,255,0.05);}
        
        /* Evidenziazione Bookmakers come da tua richiesta */
        .bk-goldbet { color: #FFcc00 !important; }
        .bk-sisal { color: #00ff00 !important; }
        .bk-dazn { font-style: italic; }

        .bc-footer { margin-top: 25px; color: rgba(255,255,255,0.6); font-size: 1.1rem; font-weight: bold; display: flex; justify-content: space-between; padding: 0 10px; text-shadow: 0 0 5px #000;}
        
    </style>
</head>
<body>

    <!-- BARRA DI REGIA -->
    <div class="top-nav">
        <div class="logo-area">BETBAR<span>-ORACLE</span></div>
        <div class="match-tabs" id="match-tabs-container"></div>
        <div class="top-tools">
            <select class="gc-select" id="match-count" onchange="initWorkspace()" title="Slot Attivi">
                <option value="1" selected>1 Match</option>
                <option value="3">3 Match</option>
                <option value="5">5 Match</option>
            </select>
            <div class="api-status" title="Status TheOdds API">API: <span id="api-credits-used">0</span> / 500</div>
        </div>
    </div>

    <!-- MAIN WORKSPACE -->
    <div class="main-workspace">
        <div class="col-left" id="col-left"></div>
        <div class="col-center" id="col-center"></div>
        <div class="col-right" id="col-right"></div>
    </div>

    <!-- SCHERMATA FULL-SCREEN BROADCAST (STUDIO EDITION) -->
    <div class="broadcast-screen" id="broadcast-screen" onclick="closeBroadcastOverlay()">
        <div class="bc-card">
            <div class="bc-match"><span id="bc-home">BOLOGNA</span> <span class="bc-vs">VS</span> <span id="bc-away">LAZIO</span></div>
            
            <div class="bc-table-wrap">
                <table class="bc-table">
                    <thead>
                        <tr>
                            <th></th><th>1</th><th>X</th><th>2</th><th>OVER<br><span style="font-size:1.2rem;">2.5</span></th><th>UNDER<br><span style="font-size:1.2rem;">2.5</span></th><th>GG</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="bo-name-1" class="bk-goldbet">GoldBet</td>
                            <td id="bo-1-1">-</td><td id="bo-x-1">-</td><td id="bo-2-1">-</td><td id="bo-o-1">-</td><td id="bo-u-1">-</td><td id="bo-g-1">-</td>
                        </tr>
                        <tr>
                            <td id="bo-name-2" class="bk-sisal">Sisal</td>
                            <td id="bo-1-2">-</td><td id="bo-x-2">-</td><td id="bo-2-2">-</td><td id="bo-o-2">-</td><td id="bo-u-2">-</td><td id="bo-g-2">-</td>
                        </tr>
                        <tr>
                            <td id="bo-name-3" class="bk-dazn">DAZNBET</td>
                            <td id="bo-1-3">-</td><td id="bo-x-3">-</td><td id="bo-2-3">-</td><td id="bo-o-3">-</td><td id="bo-u-3">-</td><td id="bo-g-3">-</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="bc-footer">
                <span>Quote soggette a variazioni</span>
                <span>🔞 🛡️ ADM</span>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "ebb57f70617f6f4bb3f531b20685b755"; 
        
        let activeMatchId = 1;
        const DEFAULT_BOOKIES = ["GoldBet", "Sisal", "DAZNBET"];

        function initWorkspace() {
            let count = parseInt(document.getElementById('match-count').value) || 1;
            let tabsHtml = ''; let leftHtml = ''; let centerHtml = ''; let rightHtml = '';
            
            for(let i=1; i<=10; i++) {
                if(i <= count) tabsHtml += `<button class="m-tab" id="tab-btn-${i}" onclick="selectMatch(${i})">🏟️ MATCH ${i}</button>`;
                
                // COLONNA 1: INPUT
                leftHtml += `
                <div class="panel-view" id="left-panel-${i}">
                    <div class="section-title">RICERCA PARTITA</div>
                    <div class="input-box">
                        <label>Lega (Circuito API)</label>
                        <select id="m${i}-league">
                            <option value="soccer_italy_serie_a" selected>🇮🇹 Serie A</option>
                            <option value="soccer_italy_serie_b">🇮🇹 Serie B</option>
                            <option value="soccer_epl">🇬🇧 Premier League</option>
                            <option value="soccer_spain_la_liga">🇪🇸 La Liga</option>
                            <option value="soccer_germany_bundesliga">🇩🇪 Bundesliga</option>
                            <option value="soccer_france_ligue_one">🇫🇷 Ligue 1</option>
                            <option value="soccer_uefa_champs_league">🇪🇺 Champions League</option>
                            <option value="soccer_uefa_europa_league">🇪🇺 Europa League</option>
                        </select>
                    </div>
                    <div class="input-box">
                        <label>Squadra Casa</label>
                        <input type="text" id="m${i}-home" placeholder="es. Milan" oninput="updateTitles(${i})">
                    </div>
                    <div class="input-box">
                        <label>Squadra Ospite</label>
                        <input type="text" id="m${i}-away" placeholder="es. Napoli" oninput="updateTitles(${i})">
                    </div>
                    <button class="api-btn" onclick="fetchOdds(${i})">📡 ESTRAPOLA QUOTE (API)</button>
                    <div style="font-size:0.75rem; color:var(--text-muted); text-align:center; margin-top:10px;">L'API cerca corrispondenze nei mercati globali. Usa nomi semplici (es. "Inter" invece di "FC Internazionale").</div>
                </div>`;

                // COLONNA 2: EDITOR COMPARATORE
                centerHtml += `
                <div class="panel-view" id="center-panel-${i}">
                    <div class="editor-header">
                        <div class="editor-title">EDITOR <span>COMPARATORE</span></div>
                        <button class="btn-broadcast" onclick="launchBroadcast(${i})">📺 VAI IN ONDA (F11)</button>
                    </div>
                    
                    <div style="text-align:center; margin-bottom:20px; font-size:1.8rem; font-weight:900;">
                        <span id="m${i}-th-disp" style="color:#fff;">CASA</span> <span style="color:var(--neon-orange); font-size:1.2rem; margin:0 10px;">VS</span> <span id="m${i}-ta-disp" style="color:#fff;">OSPITE</span>
                    </div>

                    <div class="comp-grid-wrap">
                        <div class="comp-row-header">
                            <div></div><div class="comp-lbl">1</div><div class="comp-lbl">X</div><div class="comp-lbl">2</div><div class="comp-lbl">OV 2.5</div><div class="comp-lbl">UN 2.5</div><div class="comp-lbl">GG</div>
                        </div>
                        
                        <!-- RIGA BOOKIE 1 -->
                        <div class="comp-row">
                            <input type="text" class="bookie-name" id="m${i}-b1-name" value="${DEFAULT_BOOKIES[0]}">
                            <input type="text" id="m${i}-b1-1" placeholder="-"><input type="text" id="m${i}-b1-x" placeholder="-"><input type="text" id="m${i}-b1-2" placeholder="-"><input type="text" id="m${i}-b1-o" placeholder="-"><input type="text" id="m${i}-b1-u" placeholder="-"><input type="text" id="m${i}-b1-g" placeholder="-">
                        </div>
                        
                        <!-- RIGA BOOKIE 2 -->
                        <div class="comp-row">
                            <input type="text" class="bookie-name" id="m${i}-b2-name" value="${DEFAULT_BOOKIES[1]}">
                            <input type="text" id="m${i}-b2-1" placeholder="-"><input type="text" id="m${i}-b2-x" placeholder="-"><input type="text" id="m${i}-b2-2" placeholder="-"><input type="text" id="m${i}-b2-o" placeholder="-"><input type="text" id="m${i}-b2-u" placeholder="-"><input type="text" id="m${i}-b2-g" placeholder="-">
                        </div>
                        
                        <!-- RIGA BOOKIE 3 -->
                        <div class="comp-row">
                            <input type="text" class="bookie-name" id="m${i}-b3-name" value="${DEFAULT_BOOKIES[2]}">
                            <input type="text" id="m${i}-b3-1" placeholder="-"><input type="text" id="m${i}-b3-x" placeholder="-"><input type="text" id="m${i}-b3-2" placeholder="-"><input type="text" id="m${i}-b3-o" placeholder="-"><input type="text" id="m${i}-b3-u" placeholder="-"><input type="text" id="m${i}-b3-g" placeholder="-">
                        </div>
                    </div>
                </div>`;

                // COLONNA 3: TELEGRAM EXPORT
                rightHtml += `
                <div class="panel-view" id="right-panel-${i}" style="display:flex; flex-direction:column; height:100%;">
                    <div class="tg-header">📝 GENERATORE POST</div>
                    <div style="font-size:0.75rem; color:var(--text-muted); text-align:center; margin-bottom:10px;">Crea il resoconto testuale per i canali social.</div>
                    <textarea class="tg-textarea" id="m${i}-tg-text" placeholder="Il testo apparirà qui..."></textarea>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-tg" style="background:#333; color:#fff;" onclick="generateTgText(${i})">Genera</button>
                        <button class="btn-tg" onclick="copyTgText(${i})">Copia</button>
                    </div>
                </div>`;
            }

            document.getElementById('match-tabs-container').innerHTML = tabsHtml;
            document.getElementById('col-left').innerHTML = leftHtml;
            document.getElementById('col-center').innerHTML = centerHtml;
            document.getElementById('col-right').innerHTML = rightHtml;
            
            selectMatch(1);
        }

        function selectMatch(id) {
            activeMatchId = id;
            document.querySelectorAll('.m-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel-view').forEach(p => p.classList.remove('active'));
            
            let btn = document.getElementById(`tab-btn-${id}`); if(btn) btn.classList.add('active');
            let pl = document.getElementById(`left-panel-${id}`); if(pl) pl.classList.add('active');
            let pc = document.getElementById(`center-panel-${id}`); if(pc) pc.classList.add('active');
            let pr = document.getElementById(`right-panel-${id}`); if(pr) pr.classList.add('active');
        }

        function updateTitles(id) {
            let h = document.getElementById(`m${id}-home`).value || "CASA";
            let a = document.getElementById(`m${id}-away`).value || "OSPITE";
            document.getElementById(`m${id}-th-disp`).textContent = h.toUpperCase();
            document.getElementById(`m${id}-ta-disp`).textContent = a.toUpperCase();
        }

        // MOTORE DI ESTRAZIONE API (Migliorato per evitare blocchi)
        async function fetchOdds(id) {
            let h = document.getElementById(`m${id}-home`).value.trim().toLowerCase();
            let a = document.getElementById(`m${id}-away`).value.trim().toLowerCase();
            let lKey = document.getElementById(`m${id}-league`).value;
            let btn = document.querySelector(`#left-panel-${id} .api-btn`);

            if(!h || !a) { alert("⚠️ Inserisci il nome delle squadre prima di estrapolare le quote."); return; }

            btn.textContent = "⏳ CONNESSIONE API..."; 
            btn.style.background = "var(--gold-accent)"; btn.style.color = "#000";

            try {
                // Chiedo solo h2h e totals per garantire stabilità. Il GG spesso non è fornito gratuitamente.
                const url = `https://api.the-odds-api.com/v4/sports/${lKey}/odds/?apiKey=${API_KEY}&regions=eu&markets=h2h,totals`;
                const response = await fetch(url);
                
                const remaining = response.headers.get('x-requests-remaining');
                if(remaining !== null) { document.getElementById('api-credits-used').textContent = 500 - parseInt(remaining); }

                if (!response.ok) throw new Error("Errore API HTTP " + response.status);
                const data = await response.json();
                
                let matchData = null;
                // Ricerca elastica: controlla se una stringa è contenuta nell'altra
                for (let match of data) {
                    let apiHome = match.home_team.toLowerCase(); 
                    let apiAway = match.away_team.toLowerCase();
                    if (apiHome.includes(h) || h.includes(apiHome) || apiAway.includes(a) || a.includes(apiAway)) {
                        matchData = match; 
                        console.log("Match trovato:", matchData.home_team, "vs", matchData.away_team);
                        break;
                    }
                }

                if (!matchData) {
                    alert("❌ Partita non trovata. Prova a semplificare i nomi (es. 'Inter' invece di 'FC Inter').");
                    throw new Error("Match Not Found");
                }

                let bookies = matchData.bookmakers || [];
                if(bookies.length === 0) { alert("Nessuna quota disponibile per questo match sui server europei."); throw new Error("No odds"); }

                // Riempi le 3 righe (usiamo i primi 3 bookmakers dell'API per riempire la bozza)
                for(let r=0; r<3; r++) {
                    let rIdx = r+1;
                    if(bookies[r]) {
                        let bk = bookies[r];
                        let oddsMap = { '1': '', 'X': '', '2': '', 'O': '', 'U': '', 'G': '' };

                        bk.markets.forEach(mkt => {
                            if(mkt.key === 'h2h') {
                                mkt.outcomes.forEach(out => {
                                    let n = out.name.toLowerCase();
                                    if(n === matchData.home_team.toLowerCase()) oddsMap['1'] = out.price.toFixed(2);
                                    else if(n === 'draw') oddsMap['X'] = out.price.toFixed(2);
                                    else oddsMap['2'] = out.price.toFixed(2);
                                });
                            }
                            if(mkt.key === 'totals') {
                                mkt.outcomes.forEach(out => {
                                    if(out.point === 2.5) {
                                        if(out.name.toLowerCase() === 'over') oddsMap['O'] = out.price.toFixed(2);
                                        if(out.name.toLowerCase() === 'under') oddsMap['U'] = out.price.toFixed(2);
                                    }
                                });
                            }
                        });

                        document.getElementById(`m${id}-b${rIdx}-1`).value = oddsMap['1'] || "-";
                        document.getElementById(`m${id}-b${rIdx}-x`).value = oddsMap['X'] || "-";
                        document.getElementById(`m${id}-b${rIdx}-2`).value = oddsMap['2'] || "-";
                        document.getElementById(`m${id}-b${rIdx}-o`).value = oddsMap['O'] || "-";
                        document.getElementById(`m${id}-b${rIdx}-u`).value = oddsMap['U'] || "-";
                        // GG non fornito stabilmente dall'API base, lo lasciamo vuoto o mettiamo un placeholder
                        document.getElementById(`m${id}-b${rIdx}-g`).value = ""; 
                    }
                }

                btn.textContent = "✅ QUOTE IMPORTATE!"; 
                btn.style.background = "var(--green-value)"; btn.style.color = "#fff";

            } catch (e) { 
                console.error(e);
                btn.textContent = "📡 RIPROVA API"; 
                btn.style.background = "var(--red-value)"; btn.style.color = "#fff";
            }
            
            setTimeout(() => {
                btn.textContent = "📡 ESTRAPOLA QUOTE (API)"; 
                btn.style.background = "linear-gradient(90deg, var(--cyan-accent), #00a2ff)"; 
                btn.style.color = "#000";
            }, 3000);
        }

        // GENERATORE OVERLAY BROADCAST (STUDIO EDITION)
        function launchBroadcast(id) {
            let h = document.getElementById(`m${id}-home`).value || "CASA";
            let a = document.getElementById(`m${id}-away`).value || "OSPITE";

            document.getElementById('bc-home').textContent = h.toUpperCase();
            document.getElementById('bc-away').textContent = a.toUpperCase();

            for(let r=1; r<=3; r++) {
                let bName = document.getElementById(`m${id}-b${r}-name`).value || `Bookie ${r}`;
                let cellName = document.getElementById(`bo-name-${r}`);
                cellName.textContent = bName;
                
                // Coloriamo i bookmaker per mantenere lo stile della foto
                cellName.className = '';
                if(bName.toLowerCase().includes('gold')) cellName.classList.add('bk-goldbet');
                if(bName.toLowerCase().includes('sisal')) cellName.classList.add('bk-sisal');
                if(bName.toLowerCase().includes('dazn')) cellName.classList.add('bk-dazn');

                document.getElementById(`bo-1-${r}`).textContent = document.getElementById(`m${id}-b${r}-1`).value || "-";
                document.getElementById(`bo-x-${r}`).textContent = document.getElementById(`m${id}-b${r}-x`).value || "-";
                document.getElementById(`bo-2-${r}`).textContent = document.getElementById(`m${id}-b${r}-2`).value || "-";
                document.getElementById(`bo-o-${r}`).textContent = document.getElementById(`m${id}-b${r}-o`).value || "-";
                document.getElementById(`bo-u-${r}`).textContent = document.getElementById(`m${id}-b${r}-u`).value || "-";
                document.getElementById(`bo-g-${r}`).textContent = document.getElementById(`m${id}-b${r}-g`).value || "-";
            }

            document.getElementById('broadcast-screen').style.display = 'flex';
        }

        function closeBroadcastOverlay() {
            document.getElementById('broadcast-screen').style.display = 'none';
        }

        function generateTgText(id) {
            let h = document.getElementById(`m${id}-home`).value.toUpperCase() || "CASA";
            let a = document.getElementById(`m${id}-away`).value.toUpperCase() || "OSPITE";
            let text = `🔥 BETBAR: ${h} vs ${a} 🔥\n\n`;
            for(let r=1; r<=3; r++) {
                let bn = document.getElementById(`m${id}-b${r}-name`).value;
                let v1 = document.getElementById(`m${id}-b${r}-1`).value || "-";
                let vx = document.getElementById(`m${id}-b${r}-x`).value || "-";
                let v2 = document.getElementById(`m${id}-b${r}-2`).value || "-";
                let vo = document.getElementById(`m${id}-b${r}-o`).value || "-";
                let vu = document.getElementById(`m${id}-b${r}-u`).value || "-";
                let vg = document.getElementById(`m${id}-b${r}-g`).value || "-";

                text += `📊 ${bn}\n`;
                text += `1: @${v1} | X: @${vx} | 2: @${v2}\n`;
                text += `OV 2.5: @${vo} | UN 2.5: @${vu} | GG: @${vg}\n\n`;
            }
            text += `👉 Scegli la quota migliore in diretta su Twitch!\n🤖 by BetBar Oracle`;
            document.getElementById(`m${id}-tg-text`).value = text;
        }

        function copyTgText(id) {
            let t = document.getElementById(`m${id}-tg-text`).value;
            if(!t) return;
            navigator.clipboard.writeText(t).then(() => { alert("Copiato negli appunti!"); });
        }

        initWorkspace();
    </script>
